<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosEdge CRM</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">PosEdge CRM</div>
        <ul class="sidebar-menu">
            <li><a href="/" class="active"><span>💾</span> Backup Status</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <header class="crm-header">
            <h1>Client Backup Status</h1>
        </header>

        <div class="crm-body">
            <div class="header-info">
                <span id="clientCount" class="client-count">Loading clients...</span>
            </div>
            <div
                style="margin-bottom: 20px; padding: 15px; background: #eef2ff; border-radius: 8px; border: 1px solid #c7d2fe; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3 style="margin: 0; color: #3730a3;">Deploy to a New POS</h3>
                    <p style="margin: 5px 0 0 0; font-size: 13px; color: #4338ca;">Download the Agent, extract it, and
                        double-click Start-Agent.bat</p>
                </div>
                <a href="https://github.com/DevPatel55566/posedge-update-prototype/releases/download/v1.0/install.bat"
                    style="text-decoration: none; background: #4f46e5; color: white; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 14px;">
                    ⬇️ Download Installer
                </a>
            </div>
            <div class="data-card" style="background: transparent; box-shadow: none;">
                <table class="crm-table">
                    <thead>
                        <tr>
                            <th style="width: 30%;">Client / Backup Folder Name</th>
                            <th style="width: 15%;">Computer Name</th>
                            <th style="width: 10%;">Status</th>
                            <th style="width: 15%;">Last Backup</th>
                            <th style="width: 15%;">Next Backup</th>
                            <th style="width: 15%; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="clientsBody">
                        <!-- Data inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>

</html>
